name: CI

on:
  push:
    branches: [ptpn]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-all-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: CLI smoke test
        run: |
          ./build/ptpn tdg -f example/motivating-examples/hw.json --no-analysis \
            --export-ptpn /tmp/hw.ptpn.dot --export-wcet /tmp/hw.wcet.json
          ./build/ptpn export romeo -f example/s-bench/a.json -o /tmp/a.cts

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install clang-format
        run: pip install clang-format==21.1.8

      - name: Check formatting
        run: |
          find src test -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
