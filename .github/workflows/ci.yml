name: CI

on:
  push:
    branches: [ptpn]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-all-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Webapp syntax
        run: |
          python3 -m py_compile webapp/server.py webapp/make_demo.py webapp/build_standalone.py
          python3 webapp/server.py --help > /dev/null
          node --check webapp/static/app.js

      - name: CLI smoke test
        run: |
          ./build/ptpn tdg -f example/motivating-examples/hw.json --no-analysis \
            --export-ptpn /tmp/hw.ptpn.dot --export-wcet /tmp/hw.wcet.json
          ./build/ptpn check -f test/golden/rtsl/appendix.rtsl
          ./build/ptpn rtsl -f test/golden/rtsl/appendix.rtsl --no-analysis \
            --export-tdg /tmp/appendix.tdg.json
          ./build/ptpn tdg -f /tmp/appendix.tdg.json --no-analysis
